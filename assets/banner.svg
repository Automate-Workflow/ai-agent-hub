<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img">
  <title>AI Agent Hub Banner</title>
  <desc>Hero banner featuring the AI Agent Hub title, relational knowledge graph stats, and geometric node network artwork in the official red palette.</desc>
  <rect x="0" y="0" width="1200" height="320" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="0" y="0" width="14" height="320" rx="7" fill="#B91C1C"/>
  <rect x="820" y="16" width="364" height="288" rx="14" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="1.5"/>
  <g stroke="#FEE2E2" stroke-width="1">
    <line x1="880" y1="30" x2="880" y2="290"/>
    <line x1="960" y1="30" x2="960" y2="290"/>
    <line x1="1040" y1="30" x2="1040" y2="290"/>
    <line x1="1120" y1="30" x2="1120" y2="290"/>
    <line x1="840" y1="90" x2="1164" y2="90"/>
    <line x1="840" y1="160" x2="1164" y2="160"/>
    <line x1="840" y1="230" x2="1164" y2="230"/>
  </g>
  <g stroke="#B91C1C" stroke-width="2.5" stroke-linecap="round">
    <line x1="1002" y1="160" x2="910" y2="92"/>
    <line x1="1002" y1="160" x2="1095" y2="86"/>
    <line x1="1002" y1="160" x2="1115" y2="178"/>
    <line x1="1002" y1="160" x2="1064" y2="248"/>
    <line x1="1002" y1="160" x2="922" y2="240"/>
    <line x1="1002" y1="160" x2="878" y2="168"/>
    <line x1="910" y1="92" x2="1095" y2="86" stroke-dasharray="4,4"/>
    <line x1="1095" y1="86" x2="1115" y2="178" stroke-dasharray="4,4"/>
  </g>
  <g fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5">
    <circle cx="910" cy="92" r="20"/>
    <circle cx="1095" cy="86" r="20"/>
    <circle cx="1115" cy="178" r="20"/>
    <circle cx="1064" cy="248" r="20"/>
    <circle cx="922" cy="240" r="20"/>
    <circle cx="878" cy="168" r="20"/>
  </g>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#7F1D1D" text-anchor="middle">
    <text x="910" y="95">TOOLS</text>
    <text x="1095" y="89">MCP</text>
    <text x="1115" y="181">RAG</text>
    <text x="1064" y="251">EVALS</text>
    <text x="922" y="243">SAFETY</text>
    <text x="878" y="171">MEMORY</text>
  </g>
  <circle cx="1002" cy="160" r="34" fill="#B91C1C" stroke="#7F1D1D" stroke-width="3"/>
  <text x="1002" y="164" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">AGENT</text>
  <rect x="44" y="34" width="214" height="28" rx="14" fill="#FEE2E2"/>
  <text x="151" y="53" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7F1D1D">AUTOMATE WORKFLOW · OPEN KB</text>
  <text x="44" y="114" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#111827">AI Agent Hub</text>
  <text x="44" y="152" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#6B7280">Structured, primary-sourced, visual reference for agentic AI systems</text>
  <text x="44" y="178" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7280">Types, concepts, design patterns, protocols, tools, safety risks, evals and paths.</text>
  <rect x="44" y="220" width="114" height="34" rx="8" fill="#B91C1C" stroke="#FEE2E2" stroke-width="1"/>
  <text x="101" y="242" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">13 Datasets</text>
  <rect x="168" y="220" width="114" height="34" rx="8" fill="#7F1D1D" stroke="#FEE2E2" stroke-width="1"/>
  <text x="225" y="242" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">272 Sources</text>
  <rect x="292" y="220" width="120" height="34" rx="8" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="1"/>
  <text x="352" y="242" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7F1D1D">136 Concepts</text>
  <rect x="422" y="220" width="136" height="34" rx="8" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="1"/>
  <text x="490" y="242" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7F1D1D">922 Graph Edges</text>
  <rect x="568" y="220" width="134" height="34" rx="8" fill="#FEE2E2" stroke="#FEE2E2" stroke-width="1"/>
  <text x="635" y="242" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7F1D1D">MIT + CC BY 4.0</text>
</svg>
