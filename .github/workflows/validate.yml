name: Validate Knowledge Base

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Schemas, Integrity & Generated Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate all CSV files and JSON Schemas
        run: python scripts/validate_data.py --fail-on-warnings

      - name: Check relational integrity, cycles, orphans, and graph nodes
        run: python scripts/check_integrity.py

      - name: Verify SVG charts build cleanly
        run: python scripts/build_charts.py --output-dir "${RUNNER_TEMP}/charts"

      - name: Verify site data bundle generation
        run: python scripts/build_site_data.py --output-dir "${RUNNER_TEMP}/site_data"

      - name: Verify generated docs and README are in sync
        run: |
          python scripts/build_docs.py
          git diff --exit-code README.md docs/

      - name: Print dataset statistics
        run: python scripts/stats.py
