<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img">
  <title>The Execution Loop: Single Call vs ReAct Agent Cycle</title>
  <desc>Six-step circular loop diagram illustrating iterative agent thought, action, observation, and termination checks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#B91C1C"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6B7280"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7F1D1D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="620" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="7" rx="3.5" fill="#B91C1C"/>
  <text x="36" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#111827">The Execution Loop: Single Call vs ReAct Agent Cycle</text>
  <text x="36" y="70" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B7280">Contrasting stateless single-turn generation (PT-001) with closed-loop reasoning, tool validation, safety gating, and state compaction</text>
  <line x1="36" y1="86" x2="1164" y2="86" stroke="#FEE2E2" stroke-width="1.5"/>
  <text x="36" y="602" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B7280">AI Agent Hub · Verified 2026-11-11 · CC BY 4.0</text>
  <rect x="36" y="112" width="248" height="444" rx="12" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="1.5"/>
  <text x="160" y="146" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#B91C1C">STATELESS BASELINE</text>
  <text x="160" y="168" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#111827">Single Call (PT-001)</text>
  <rect x="54" y="196" width="212" height="54" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="160" y="219" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#111827">1. Prompt + Schema</text>
  <text x="160" y="238" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">Assemble system prompt &amp; user query</text>
  <line x1="160" y1="250" x2="160" y2="267" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <rect x="54" y="270" width="212" height="54" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="160" y="293" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#111827">2. One LLM Pass</text>
  <text x="160" y="312" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">Single forward generation pass</text>
  <line x1="160" y1="324" x2="160" y2="341" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <rect x="54" y="344" width="212" height="54" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="160" y="367" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#111827">3. Schema Parse</text>
  <text x="160" y="386" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">Validate structured JSON output</text>
  <line x1="160" y1="398" x2="160" y2="415" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow-muted)"/>
  <rect x="54" y="418" width="212" height="54" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="160" y="441" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#111827">4. Direct Return</text>
  <text x="160" y="460" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">Zero iterative tool observation</text>
  <text x="160" y="514" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7F1D1D">Best when task is deterministic,</text>
  <text x="160" y="532" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7280">low latency, and self-contained.</text>
  <rect x="316" y="112" width="848" height="444" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="740" y="144" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#7F1D1D">BOUNDED AGENT EXECUTION LOOP (PT-007 / PT-008 ReAct + Safety Gates)</text>
  <rect x="348" y="178" width="232" height="114" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.8"/>
  <text x="464" y="204" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#B91C1C">STEP 1 · PERCEIVE &amp; LOAD</text>
  <text x="464" y="230" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="800" fill="#7F1D1D">Context + Working Memory</text>
  <text x="464" y="256" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">Assemble user intent, compacted history,</text>
  <text x="464" y="273" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">&amp; retrieved facts</text>
  <rect x="626" y="178" width="232" height="114" rx="10" fill="#B91C1C" stroke="#7F1D1D" stroke-width="1.8"/>
  <text x="742" y="204" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FEE2E2">STEP 2 · REASON &amp; PLAN</text>
  <text x="742" y="230" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="800" fill="#FFFFFF">Thought / Plan Step</text>
  <text x="742" y="256" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF">Decide final answer OR select</text>
  <text x="742" y="273" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF">next structured action</text>
  <rect x="904" y="178" width="232" height="114" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.8"/>
  <text x="1020" y="204" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#B91C1C">STEP 3 · SCHEMA CHECK</text>
  <text x="1020" y="230" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="800" fill="#7F1D1D">Validate Arguments</text>
  <text x="1020" y="256" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">Enforce JSON Schema contract &amp;</text>
  <text x="1020" y="273" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">clear error formatting</text>
  <rect x="904" y="372" width="232" height="114" rx="10" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.8"/>
  <text x="1020" y="398" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#B91C1C">STEP 4 · POLICY &amp; HIL</text>
  <text x="1020" y="424" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="800" fill="#7F1D1D">Approval &amp; Least Privilege</text>
  <text x="1020" y="450" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">Check RBAC scope; trigger approval</text>
  <text x="1020" y="467" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">interrupt if risky</text>
  <rect x="626" y="372" width="232" height="114" rx="10" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.8"/>
  <text x="742" y="398" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#B91C1C">STEP 5 · ACT IN SANDBOX</text>
  <text x="742" y="424" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="800" fill="#111827">Execute Tool / MCP / API</text>
  <text x="742" y="450" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">Run deterministic tool or</text>
  <text x="742" y="467" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">isolated microVM script</text>
  <rect x="348" y="372" width="232" height="114" rx="10" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.8"/>
  <text x="464" y="398" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#B91C1C">STEP 6 · OBSERVE &amp; CHECK</text>
  <text x="464" y="424" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="800" fill="#7F1D1D">Append Result &amp; Budget</text>
  <text x="464" y="450" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">Update trace &amp; episodic state;</text>
  <text x="464" y="467" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">terminate or loop back</text>
  <line x1="580" y1="235" x2="622" y2="235" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="858" y1="235" x2="900" y2="235" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1020" y1="292" x2="1020" y2="368" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="904" y1="429" x2="862" y2="429" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="626" y1="429" x2="584" y2="429" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="464" y1="372" x2="464" y2="296" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="348" y="504" width="788" height="36" rx="8" fill="#7F1D1D" stroke="#7F1D1D" stroke-width="1.5"/>
  <text x="742" y="526" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">TERMINATION GUARD: Exit cleanly when Goal Satisfied OR Step / Token / Timeout Budget Reached (RS-020)</text>
</svg>
