<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img">
  <title>Anatomy of a Production AI Agent</title>
  <desc>Architectural diagram showing user ingress, prompt/memory context assembly, LLM brain, validation/approval rails, tools/MCP/sandbox execution, and telemetry spine.</desc>
