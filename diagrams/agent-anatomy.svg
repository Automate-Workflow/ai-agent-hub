  <text x="36" y="70" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B7280">End-to-end runtime architecture unifying context engineering, reasoning core, safety gates, tools, memory, and telemetry</text>
