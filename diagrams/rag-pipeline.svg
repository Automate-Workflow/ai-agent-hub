  <text x="155" y="424" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111827">Intent + Input Guardrail</text>
  <text x="155" y="448" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">ACL scope check</text>
  <line x1="254" y1="427" x2="274" y2="427" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="278" y="366" width="198" height="122" rx="10" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="1.5"/>
  <text x="377" y="396" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#7F1D1D">2. Hybrid Search</text>
  <text x="377" y="424" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111827">Dense + BM25 RRF Fusion</text>
  <text x="377" y="448" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">Candidate recall set</text>
  <line x1="476" y1="427" x2="496" y2="427" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="500" y="366" width="198" height="122" rx="10" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="1.5"/>
