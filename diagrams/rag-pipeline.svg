  <text x="710" y="562" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#111827">Rewrite query, trigger secondary web/MCP tool search, OR abstain safely (RS-002).</text>
