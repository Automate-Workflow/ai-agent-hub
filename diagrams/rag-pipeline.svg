<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img">
  <title>Retrieval-Augmented Generation (RAG) &amp; Grounding Pipeline</title>
  <desc>Two-track RAG dataflow diagram depicting offline corpus indexing and online corrective retrieval with RAG Triad evaluation.</desc>
  <defs>
