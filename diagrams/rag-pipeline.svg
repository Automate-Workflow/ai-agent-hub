  <text x="821" y="212" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111827">Bi-encoder &amp; Lexical</text>
  <text x="821" y="236" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">CP-036 / Hybrid index</text>
