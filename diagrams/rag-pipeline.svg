  <text x="36" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#111827">Retrieval-Augmented Generation (RAG) &amp; Grounding Pipeline</text>
  <text x="36" y="70" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B7280">End-to-end architecture combining structured ingestion, hybrid retrieval, neural reranking, corrective fallback, and cited synthesis</text>
