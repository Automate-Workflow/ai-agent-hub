  <text x="821" y="424" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111827">CRAG Evaluator (PT-015)</text>
  <text x="821" y="448" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">High score or fallback</text>
  <line x1="920" y1="427" x2="940" y2="427" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="944" y="366" width="198" height="122" rx="10" fill="#B91C1C" stroke="#7F1D1D" stroke-width="1.5"/>
  <text x="1043" y="396" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">5. Cited Synthesis</text>
  <text x="1043" y="424" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Grounded Answer + Spans</text>
  <text x="1043" y="448" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#FEE2E2">RAG Triad Eval (EV-011)</text>
  <path d="M 1043 270 L 1043 302 L 377 302 L 377 362" fill="none" stroke="#7F1D1D" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-dark)"/>
  <rect x="500" y="514" width="420" height="76" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
