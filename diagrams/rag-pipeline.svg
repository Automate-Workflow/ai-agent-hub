  <text x="599" y="424" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111827">Cross-Encoder Scoring</text>
  <text x="599" y="448" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6B7280">Prunes weak passages</text>
  <line x1="698" y1="427" x2="718" y2="427" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="722" y="366" width="198" height="122" rx="10" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="1.5"/>
