  <line x1="920" y1="546" x2="1043" y2="492" stroke="#B91C1C" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="56" y="514" width="412" height="76" rx="10" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="1.5"/>
  <text x="262" y="540" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#7F1D1D">CONTINUOUS RAG TRIAD QUALITY GATES</text>
  <text x="262" y="562" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7280">Context Relevance + Groundedness + Answer Relevance (EV-003/004/011)</text>
