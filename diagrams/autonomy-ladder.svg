  <text x="799" y="152" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6B7280">TYPICAL PATTERN</text>
  <text x="799" y="170" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#B91C1C">PT-035 · Durable Execution</text>
