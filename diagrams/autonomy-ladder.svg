  <text x="164" y="266" text-anchor="start" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#FFFFFF">Supervisor orchestrates scoped workers and critics.</text>
  <rect x="694" y="228" width="210" height="50" rx="8" fill="#FFFFFF" stroke="#FEE2E2" stroke-width="1.5"/>
  <text x="799" y="248" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6B7280">TYPICAL PATTERN</text>
  <text x="799" y="266" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#B91C1C">PT-017 · Supervisor Team</text>
  <rect x="918" y="228" width="226" height="50" rx="8" fill="#FFFFFF" stroke="#FEE2E2" stroke-width="1.5"/>
  <text x="1031" y="248" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6B7280">MANDATORY SAFEGUARD</text>
  <text x="1031" y="266" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7F1D1D">Isolated context &amp; audit traces</text>
  <rect x="180" y="116" width="984" height="82" rx="10" fill="#7F1D1D" stroke="#7F1D1D" stroke-width="1.5"/>
