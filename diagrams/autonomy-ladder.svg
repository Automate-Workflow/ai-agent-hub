  <text x="128" y="362" text-anchor="start" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#FFFFFF">Iterates read/sandboxed tools under fixed step bounds.</text>
  <rect x="694" y="324" width="210" height="50" rx="8" fill="#FFFFFF" stroke="#FEE2E2" stroke-width="1.5"/>
  <text x="799" y="344" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6B7280">TYPICAL PATTERN</text>
  <text x="799" y="362" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#B91C1C">PT-008 · ReAct + Sandboxes</text>
  <rect x="918" y="324" width="226" height="50" rx="8" fill="#FFFFFF" stroke="#FEE2E2" stroke-width="1.5"/>
  <text x="1031" y="344" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#6B7280">MANDATORY SAFEGUARD</text>
  <text x="1031" y="362" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7F1D1D">OAuth scopes &amp; step budgets</text>
  <rect x="144" y="212" width="1020" height="82" rx="10" fill="#B91C1C" stroke="#7F1D1D" stroke-width="1.5"/>
