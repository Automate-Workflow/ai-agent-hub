  <text x="1031" y="458" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7F1D1D">Explicit write/send interrupts</text>
  <rect x="108" y="308" width="1056" height="82" rx="10" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.5"/>
