  <text x="92" y="458" text-anchor="start" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827">Agent prepares structured tool call; awaits signoff.</text>
  <rect x="694" y="420" width="210" height="50" rx="8" fill="#FFFFFF" stroke="#FEE2E2" stroke-width="1.5"/>
