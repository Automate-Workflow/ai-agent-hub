  <text x="799" y="458" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#B91C1C">PT-011 · Approval Gate</text>
  <rect x="918" y="420" width="226" height="50" rx="8" fill="#FFFFFF" stroke="#FEE2E2" stroke-width="1.5"/>
