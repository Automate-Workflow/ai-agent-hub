  <text x="828" y="133" text-anchor="start" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#7F1D1D">3. ORCHESTRATOR-WORKERS (PT-005)</text>
  <text x="828" y="152" text-anchor="start" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7280">Dynamic subtask split &amp; synthesis</text>
  <text x="988" y="358" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B91C1C">Best when subtask count is unknown upfront.</text>
  <rect x="924" y="180" width="128" height="32" rx="8" fill="#B91C1C" stroke="#7F1D1D" stroke-width="1.5"/>
  <text x="988" y="200" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Orchestrator</text>
