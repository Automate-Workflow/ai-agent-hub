  <rect x="424" y="432" width="352" height="16" fill="#FEF2F2"/>
  <text x="440" y="421" text-anchor="start" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#7F1D1D">5. SWARM HANDOFFS (PT-018)</text>
  <text x="440" y="440" text-anchor="start" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7280">Peer-to-peer context transfer</text>
  <text x="600" y="646" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B91C1C">Best for front-desk triage handing off live sessions.</text>
