  <text x="828" y="421" text-anchor="start" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#7F1D1D">6. DEBATE &amp; CRITIC (PT-019)</text>
