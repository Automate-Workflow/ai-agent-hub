  <text x="500" y="259" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Router</text>
  <rect x="630" y="192" width="112" height="34" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="686" y="213" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7F1D1D">SQL Expert</text>
