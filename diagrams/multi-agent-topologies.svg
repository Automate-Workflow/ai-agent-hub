  <text x="988" y="646" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B91C1C">Best for catching reasoning errors &amp; bias checks.</text>
