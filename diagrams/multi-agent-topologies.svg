<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img">
  <title>Canonical Workflow &amp; Multi-Agent Topologies</title>
  <desc>Six-panel grid displaying visual node-link topologies for Prompt Chaining, Routing, Orchestrator-Workers, Supervisor, Swarm, and Debate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#B91C1C"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6B7280"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7F1D1D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="720" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="7" rx="3.5" fill="#B91C1C"/>
  <text x="36" y="46" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#111827">Canonical Workflow &amp; Multi-Agent Topologies</text>
  <text x="36" y="70" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B7280">Six architectural patterns comparing control predictability, inter-agent communication structure, and ideal workload fit</text>
  <line x1="36" y1="86" x2="1164" y2="86" stroke="#FEE2E2" stroke-width="1.5"/>
  <text x="36" y="702" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B7280">AI Agent Hub · Verified 2026-11-11 · CC BY 4.0</text>
  <rect x="36" y="108" width="352" height="266" rx="12" fill="#FFFFFF" stroke="#FEE2E2" stroke-width="1.5"/>
  <rect x="36" y="108" width="352" height="52" rx="12" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="1.5"/>
  <rect x="36" y="144" width="352" height="16" fill="#FEF2F2"/>
  <text x="52" y="133" text-anchor="start" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#7F1D1D">1. PROMPT CHAINING (PT-002)</text>
  <text x="52" y="152" text-anchor="start" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7280">Fixed sequential stages + gates</text>
  <text x="212" y="358" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B91C1C">Best for predictable multi-step transforms.</text>
  <rect x="84" y="232" width="68" height="44" rx="8" fill="#FEE2E2" stroke="#7F1D1D" stroke-width="1.5"/>
  <text x="118" y="259" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7F1D1D">Step 1</text>
  <line x1="152" y1="254" x2="182" y2="254" stroke="#B91C1C" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="186" y="232" width="68" height="44" rx="8" fill="#B91C1C" stroke="#7F1D1D" stroke-width="1.5"/>
  <text x="220" y="259" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Step 2</text>
  <line x1="254" y1="254" x2="284" y2="254" stroke="#B91C1C" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="288" y="232" width="68" height="44" rx="8" fill="#FEE2E2" stroke="#7F1D1D" stroke-width="1.5"/>
  <text x="322" y="259" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7F1D1D">Step 3</text>
  <rect x="424" y="108" width="352" height="266" rx="12" fill="#FFFFFF" stroke="#FEE2E2" stroke-width="1.5"/>
  <rect x="424" y="108" width="352" height="52" rx="12" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="1.5"/>
  <rect x="424" y="144" width="352" height="16" fill="#FEF2F2"/>
  <text x="440" y="133" text-anchor="start" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#7F1D1D">2. ROUTING (PT-003)</text>
  <text x="440" y="152" text-anchor="start" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7280">Classifier dispatches to specialist</text>
  <text x="600" y="358" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B91C1C">Best when distinct intents need different prompts/SLMs.</text>
