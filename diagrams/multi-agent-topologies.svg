  <text x="52" y="421" text-anchor="start" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#7F1D1D">4. SUPERVISOR LOOP (PT-017)</text>
  <text x="52" y="440" text-anchor="start" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6B7280">Central stateful coordinator cycles</text>
  <text x="212" y="646" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#B91C1C">Best for managed specialist delegation &amp; HIL.</text>
