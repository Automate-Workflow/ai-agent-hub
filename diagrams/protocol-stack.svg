  <text x="36" y="70" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B7280">Layered interoperability mapping all 16 protocols and standards (PS-001..PS-016) across transport, auth, tools, agents, and governance</text>
