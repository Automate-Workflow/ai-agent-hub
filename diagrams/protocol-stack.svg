  <text x="66" y="178" text-anchor="start" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="400" fill="#6B7280">Cross-vendor task lifecycle, capability Agent Cards &amp; peer delegation</text>
