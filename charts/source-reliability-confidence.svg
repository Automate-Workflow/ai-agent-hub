  <rect x="210" y="156" width="638" height="20" rx="4" fill="#FEF2F2"/>
  <text x="856" y="170" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#111827">0</text>
